<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Get Fanager</title>
  <style>
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #0A1628; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      text-align: center;
    }
    main { padding: 32px 24px; }
    h1 { font-size: 24px; margin: 0 0 8px; }
    .subtitle { color: #9CA3AF; font-size: 14px; margin: 0 0 28px; }
    .store-buttons { display: flex; gap: 16px; justify-content: center; align-items: center; flex-wrap: wrap; }
    .store-badge img { height: 52px; display: block; }
  </style>
</head>
<body>
  <main>
    <h1>Get Fanager</h1>
    <p class="subtitle">Manage and follow recreational sports leagues</p>
    <div class="store-buttons">
      <a id="ios-store" class="store-badge" href="https://apps.apple.com/app/fanager/id6759442301">
        <img src="/images/badges/app-store-badge.svg" alt="Download on the App Store">
      </a>
      <a id="android-store" class="store-badge" href="https://play.google.com/store/apps/details?id=com.leaguemgr.league_mgr_app">
        <img src="/images/badges/google-play-badge.png" alt="Get it on Google Play">
      </a>
    </div>
  </main>
  <script>
    (function () {
      var iosStoreUrl = 'https://apps.apple.com/app/fanager/id6759442301';
      var androidStoreUrl =
        'https://play.google.com/store/apps/details?id=com.leaguemgr.league_mgr_app';

      // Banner QR short codes -> analytics template names. The QR encodes
      // /get?c=<code> to keep the QR at version 3-M; this page expands the
      // code into Play Console UTM attribution. Unknown/missing codes omit
      // the referrer. iOS attribution is intentionally dropped (App Store
      // URLs discard query params; Apple ct/pt campaigns are out of scope).
      var templateMap = {
        lp: 'league_promo',
        sa: 'season_announcement',
        gd: 'game_day',
        fs: 'final_score',
        ss: 'season_schedule'
      };
      var code = new URLSearchParams(window.location.search).get('c');
      // hasOwnProperty guard: bare templateMap[code] would hit the
      // prototype chain for inputs like ?c=constructor.
      var template = Object.prototype.hasOwnProperty.call(templateMap, code)
        ? templateMap[code]
        : null;
      if (template) {
        androidStoreUrl += '&referrer=' +
          encodeURIComponent('utm_source=banner&utm_content=' + template);
      }
      document.getElementById('android-store').href = androidStoreUrl;

      // iPadOS Safari sends a desktop (Macintosh) UA by default, so iPads
      // land on this badge page instead of auto-redirecting. Accepted.
      var ua = navigator.userAgent || '';
      if (/iPhone|iPad|iPod/i.test(ua)) {
        window.location.replace(iosStoreUrl);
      } else if (/Android/i.test(ua)) {
        window.location.replace(androidStoreUrl);
      }
    })();
  </script>
</body>
</html>
